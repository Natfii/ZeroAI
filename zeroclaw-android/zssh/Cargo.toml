[package]
name = "zssh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minimal interactive SSH client bundled with ZeroAI for terminal-native ssh"

[[bin]]
name = "zssh"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Reuse only deps already pinned in the workspace Cargo.lock — no new crates.
russh = { version = "0.56", default-features = false, features = ["ring"] }
tokio = { version = "1.50", features = [
    "rt",
    "macros",
    "io-std",
    "io-util",
    "net",
    "signal",
    "time",
    "sync",
] }
nix = { version = "0.29", features = ["term", "ioctl", "signal"] }
zeroize = { version = "1.8", features = ["derive"] }
