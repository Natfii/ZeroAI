[package]
name = "zeroclaw-ffi"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "UniFFI-annotated facade for ZeroClaw Android bindings"

[lib]
crate-type = ["cdylib"]
name = "zeroclaw"

[lints]
workspace = true

[dependencies]
uniffi = "0.29"
thiserror = "2.0"
# Upstream zeroclaw is now a 17-crate workspace (v0.8.0-beta-1). The root
# crate (`zeroclawlabs`) is a re-export shim layer — we pull it in and
# alias it back to `zeroclaw` so existing `use zeroclaw::*` paths in the
# FFI source resolve without touching every file.
#
# Features kept minimal for Android: agent-runtime + gateway + our 3
# kept channels. No TUI, no acp-bridge, no observability-prometheus.
zeroclaw = { package = "zeroclawlabs", path = "../../zeroclaw", default-features = false, features = [
    "agent-runtime",
    "gateway",
    "channel-telegram",
    "channel-discord",
    "channel-webhook",
] }
# Direct sub-crate deps for items the root `zeroclaw` shim doesn't re-export
# publicly (skills, security policy types, config sub-modules like `pairing`).
# Kept minimal — only add a sub-crate when a needed item isn't reachable via
# the root re-export.
zeroclaw-api = { path = "../../zeroclaw/crates/zeroclaw-api" }
zeroclaw-config = { path = "../../zeroclaw/crates/zeroclaw-config" }
zeroclaw-runtime = { path = "../../zeroclaw/crates/zeroclaw-runtime" }
zeroclaw-tools = { path = "../../zeroclaw/crates/zeroclaw-tools" }
# Local Android-only Rust additions (scripting, Google Messages bridge,
# ClawBoy triggers, FFI credential hook, custom auth, Discord
# backfill/buffer, memory extras,).
zeroai = { path = "../zeroai" }
tokio = { version = "1.50", features = ["rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
# rustls is brought in transitively via reqwest / tokio-tungstenite, but
# the Discord channel reaches rustls APIs directly and panics on first
# TLS handshake when no process-wide CryptoProvider is installed. Pin
# the same `ring` provider the upstream binary uses (see zeroclaw/src/main.rs:1253)
# and install it once at FFI start.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
nanohtml2text = "0.1"
futures-util = "0.3"
anyhow = "1.0"
once_cell = "1"
async-trait = "0.1"
toml = "0.8"
tracing = "0.1"
chrono = "0.4"
rhai = { version = "1.21", features = ["sync"] }
urlencoding = "2.1"
secrecy = "0.10"

# ClawBoy — AI-played Game Boy emulator
boytacean = { version = "0.11", default-features = false }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
sha1 = "0.10"
png = "0.17"
base64 = "0.22"

# Google Messages bridge — QR code generation
qrcode = "0.14"

# TTY — PTY management for local shell
nix = { version = "0.29", features = ["fs", "process", "signal", "term", "ioctl"] }
zeroize = { version = "1.8", features = ["derive"] }

# SSH key management and client
# default-features = false: disable russh's own rsa feature to avoid a
# rand_core API conflict between russh's internal forked ssh-key and rsa 0.9.
# RSA key generation goes through russh::keys + ssh-key directly instead.
# russh >= 0.60.3 fixes RUSTSEC-2026-0153/0154 (CryptoVec / agent frame-size
# unbounded allocation); the standalone russh-keys crate was dropped because
# it pinned the vulnerable russh-cryptovec 0.48 — russh::keys is used instead.
russh = { version = "0.61", default-features = false, features = ["ring"] }
ssh-key = { version = "0.6", features = ["rsa", "ecdsa", "p256", "encryption"] }
rsa = "0.9"
uuid = { version = "1", features = ["v4"] }
rand_core = "0.6"
# Memory consolidation — direct SQLite access for backlog table operations
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"

[features]
default = ["ghostty-vt"]
ghostty-vt = []

[dev-dependencies]
tempfile = "3"
# Round-trip tests for the hardware-key DER→SSH signature conversion: p256
# stands in for Android Keystore's SHA256withECDSA signer, and `signature`
# provides the Verifier trait implemented by the standalone ssh-key 0.6.
p256 = { version = "0.13", features = ["ecdsa"] }
signature = "2"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }
